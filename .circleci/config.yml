version: 2.1

jobs:
  build-backend:
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build backend Docker image
          command: |
            docker build -t backend-image ./backend

  build-frontend:
    docker:
      - image: cimg/node:18.17
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build frontend Docker image
          command: |
            docker build -t frontend-image ./frontend

workflows:
  version: 2
  build_and_test:
    jobs:
      - build-backend
      - build-frontend
